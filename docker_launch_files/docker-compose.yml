# Quest 3S 遥操 FR3 —— 运行容器
#
#   cd <仓库根>
#   xhost +local:docker                                        # RViz 要显示就得先执行(每次重启后)
#   docker compose -f docker_launch_files/docker-compose.yml build
#   docker compose -f docker_launch_files/docker-compose.yml run --rm franka_dev
#
# 再开一个终端接进同一个容器：
#   docker exec -it franka_dev bash
#
# 仓库根整个挂到容器里的 /docker_volume —— 容器内路径与文档、脚本、
# 已有 launch 文件里写的 /docker_volume/... 完全一致。

services:

  franka_dev:

    build:
      context: ./franka_ros2
      dockerfile: Dockerfile

    # ⚠️ 这台开发机上已经有一个在跑的老容器 franka_dev（镜像 tag libfranka:franka_ros2）。
    #    这里【故意】用不同的镜像 tag，避免 build 把老 tag 抢走影响正在跑的通路。
    #    容器名默认仍是 franka_dev（tools/ 里的脚本 docker exec 找的就是这个名字）；
    #    要和老容器并存就改名：
    #        FRANKA_CONTAINER_NAME=franka_dev2 docker compose -f ... up -d
    image: ${FRANKA_IMAGE:-franka_quest_teleop:humble}

    container_name: ${FRANKA_CONTAINER_NAME:-franka_dev}

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw   # RViz
      - /dev:/dev                          # adb 读 Quest(USB) + 实时设备
      - ..:/docker_volume                  # ★ 仓库根 = /docker_volume

    environment:
      - DISPLAY=${DISPLAY}
      - TZ=Asia/Shanghai
      - LD_LIBRARY_PATH=${LD_LIBRARY_PATH}:/usr/lib/x86_64-linux-gnu

    # 必须 host 网络：机械臂在 172.16.0.2/3，且要和宿主机上的 ROS 节点互通
    network_mode: host

    # FR3 的 1kHz 实时控制回路需要 SYS_NICE 提实时优先级；
    # privileged + /dev 挂载是为了 adb 直接看到 USB 上的 Quest
    privileged: true
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      memlock: -1

    tty: true
    stdin_open: true
