# 右臂控制器(前缀 right_)。/**: 通配命名空间, 兼容 /right/controller_manager。
# SIM/fake 下不含 franka_robot_state_broadcaster。
/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000  # Hz

      right_fr3_arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

  right_fr3_arm_controller:
    ros__parameters:
      command_interfaces:
        - effort
      state_interfaces:
        - position
        - velocity
      joints:
        - right_fr3_joint1
        - right_fr3_joint2
        - right_fr3_joint3
        - right_fr3_joint4
        - right_fr3_joint5
        - right_fr3_joint6
        - right_fr3_joint7
      gains:
        right_fr3_joint1: { p: 600., d: 30., i: 0., i_clamp: 1. }
        right_fr3_joint2: { p: 600., d: 30., i: 0., i_clamp: 1. }
        right_fr3_joint3: { p: 600., d: 30., i: 0., i_clamp: 1. }
        right_fr3_joint4: { p: 600., d: 30., i: 0., i_clamp: 1. }
        right_fr3_joint5: { p: 250., d: 10., i: 0., i_clamp: 1. }
        right_fr3_joint6: { p: 150., d: 10., i: 0., i_clamp: 1. }
        right_fr3_joint7: { p: 50., d: 5., i: 0., i_clamp: 1. }
